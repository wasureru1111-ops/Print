<!DOCTYPE html>
<html lang="ja" data-view="imp" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中綴じ冊子メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --font:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",Roboto,sans-serif;
  --bg:#F3F4F9; --surface:#FFFFFF; --surface2:#EBEDF5; --text:#16181F; --text2:#4A4E5C;
  --line:#DCDFEA; --line-strong:#8E93A6; --primary:#1B3FE0; --on-primary:#FFFFFF;
  --primary-soft:#E2E7FF; --on-soft:#0B2096; --focus:#FFD43D; --focus-in:#000000;
  --ok:#157A46; --warn:#7A4A00; --warn-bg:#FFF3DC; --err:#C50000; --err-bg:#FDEDED;
  --stage1:#E6E9F3; --stage2:#D2D7E6; --glass:rgba(255,255,255,.88);
  --r-card:16px; --r-ctl:12px; --btn-h:48px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101116; --surface:#1B1C22; --surface2:#272932; --text:#F1F2F6; --text2:#B8BBC8;
    --line:#34363F; --line-strong:#70748A; --primary:#9DB0FF; --on-primary:#08155E;
    --primary-soft:#26307A; --on-soft:#D4DBFF; --focus:#FFD43D; --focus-in:#FFFFFF;
    --ok:#5FD08F; --warn:#FFC866; --warn-bg:#3A2B0B; --err:#FF8A8A; --err-bg:#3F1717;
    --stage1:#22242D; --stage2:#101116; --glass:rgba(27,28,34,.88); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101116; --surface:#1B1C22; --surface2:#272932; --text:#F1F2F6; --text2:#B8BBC8;
  --line:#34363F; --line-strong:#70748A; --primary:#9DB0FF; --on-primary:#08155E;
  --primary-soft:#26307A; --on-soft:#D4DBFF; --focus:#FFD43D; --focus-in:#FFFFFF;
  --ok:#5FD08F; --warn:#FFC866; --warn-bg:#3A2B0B; --err:#FF8A8A; --err-bg:#3F1717;
  --stage1:#22242D; --stage2:#101116; --glass:rgba(27,28,34,.88); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;margin:0;padding:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:40}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--focus-in);outline-offset:2px;box-shadow:0 0 0 5px var(--focus)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{font-size:.8125rem;color:var(--text2);line-height:1.55}

/* ヘッダー */
.top{position:relative;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.1875rem;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.brand p{font-size:.78rem;color:var(--text2);line-height:1.4}
@media (max-width:560px){.brand p{display:none}}

/* レイアウト */
.wrap{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 150px}
.side,.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:960px){
  .top{position:sticky;top:env(safe-area-inset-top,0px)}
  .wrap{grid-template-columns:376px minmax(0,1fr);gap:24px;padding-block:24px 48px;align-items:start}
  .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow-y:auto;padding:2px}
  .bnav,.fab{display:none!important}
}
@media (max-width:959px){
  html[data-view="set"] .stage{display:none}
  html:not([data-view="set"]) .side{display:none}
  .desk-only{display:none!important}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card>h2{font-size:1rem;font-weight:700;line-height:1.4;display:flex;align-items:center;gap:8px}
.card>h2 small{font-weight:500;color:var(--text2);font-size:.8125rem}

/* ボタン */
.btn{min-height:var(--btn-h);padding:0 20px;border-radius:var(--r-ctl);border:2px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.3;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.sub{background:transparent;color:var(--primary);border-color:var(--line-strong)}
.btn.tonal{background:var(--primary-soft);color:var(--on-soft);border-color:transparent}
.btn.sm{min-height:40px;padding:0 14px;font-size:.875rem}
.btn.danger{background:transparent;color:var(--err);border-color:var(--err)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{padding:10px 12px;border-radius:var(--r-ctl);font-size:.875rem;line-height:1.55}
.msg.err{background:var(--err-bg);color:var(--err);font-weight:500}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg.info{background:var(--surface2);color:var(--text2)}
.msg.good{background:var(--primary-soft);color:var(--on-soft)}

/* ファイル */
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:16px 12px;border:2px dashed var(--line-strong);border-radius:var(--r-ctl);background:var(--surface2);cursor:pointer;color:var(--text2);font-size:.875rem}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--primary);background:var(--primary-soft);color:var(--on-soft)}
.drop b{color:var(--text);font-size:1rem}
.drop:hover b,.drop.over b{color:var(--on-soft)}
.fileinfo{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-ctl);background:var(--surface2);min-width:0}
.fileinfo>svg{flex:none;color:var(--primary)}
.fi-t{min-width:0;flex:1}
.fi-t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9375rem}
.fi-t small{color:var(--text2);font-size:.8125rem}
.badge{display:inline-block;padding:1px 8px;border-radius:100px;background:var(--primary-soft);color:var(--on-soft);font-size:.75rem;font-weight:700;margin-left:6px}

/* 設定部品 */
fieldset{border:0;padding:0;margin:0;min-width:0}
legend,.lbl{font-size:.875rem;font-weight:700;margin-bottom:8px;padding:0;display:block}
.bind{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.opt-body{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:12px 6px;border:2px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);min-height:108px;justify-content:center}
.opt-body b{font-size:.9375rem}
.opt-body small{color:var(--text2);line-height:1.35;font-size:.78rem}
.opt-body svg{color:var(--text2);margin-bottom:4px}
.opt input:checked+.opt-body{border-color:var(--primary);background:var(--primary-soft);color:var(--on-soft)}
.opt input:checked+.opt-body svg,.opt input:checked+.opt-body small{color:var(--on-soft)}
.opt input:focus-visible+.opt-body{outline:2px solid var(--focus-in);outline-offset:2px;box-shadow:0 0 0 5px var(--focus)}
.sel{width:100%;min-height:var(--btn-h);padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer}
.rng{display:flex;align-items:center;gap:12px}
.rng input[type=range]{flex:1;min-width:0;accent-color:var(--primary);height:32px}
.rng output{min-width:4.2em;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sw{display:flex;align-items:center;gap:12px;cursor:pointer;position:relative;min-height:44px}
.sw input{position:absolute;opacity:0;width:100%;height:100%;inset:0;margin:0;cursor:pointer}
.trk{flex:none;width:50px;height:30px;border-radius:100px;background:var(--surface2);border:2px solid var(--line-strong);position:relative;transition:background .15s}
.trk::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--line-strong);transition:transform .15s,background .15s}
.sw input:checked+.trk{background:var(--primary);border-color:var(--primary)}
.sw input:checked+.trk::after{transform:translateX(20px);background:var(--on-primary)}
.sw input:focus-visible+.trk{outline:2px solid var(--focus-in);outline-offset:2px;box-shadow:0 0 0 5px var(--focus)}
.sw-t b{display:block;font-size:.9375rem;line-height:1.4}
.sw-t small{color:var(--text2);line-height:1.4;display:block;font-size:.8125rem}
.sub-opts{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:var(--r-ctl);background:var(--surface2)}
.sub-opts[hidden]{display:none}

/* セグメント */
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;max-width:100%}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;min-height:38px;padding:0 14px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--text2);white-space:nowrap;font-size:.9375rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.22)}

/* ステージ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:8px;margin:0}
.stats div{background:var(--surface2);border-radius:var(--r-ctl);padding:10px 12px;min-width:0}
.stats dt{font-size:.75rem;color:var(--text2);line-height:1.4}
.stats dd{margin:0;font-size:1.25rem;font-weight:700;line-height:1.4;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats dd.sub{font-size:.75rem;font-weight:400;color:var(--text2);line-height:1.4}
.stats dd small{font-size:.75rem;font-weight:500;color:var(--text2);margin-left:2px}
.tabs{display:flex;gap:2px;padding:3px;margin:0;background:var(--surface2);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:42px;padding:0 16px;border:0;border-radius:11px;background:transparent;cursor:pointer;font-weight:500;color:var(--text2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--primary);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.22)}
@media (max-width:959px){.tabs{display:none}}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel[hidden]{display:none}
.sheetbox{background:var(--stage1);border-radius:var(--r-ctl);padding:14px;display:flex;flex-direction:column;gap:10px}
.sheetbox canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);border-radius:2px}
.slots{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:.875rem}
.slots b{font-size:1.0625rem}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.nav{display:flex;align-items:center;gap:8px;flex:1;min-width:220px}
.nav input{flex:1;min-width:0;accent-color:var(--primary);height:32px}
.nav .btn{min-width:44px;padding:0}
.pos{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.order{padding:10px 12px;background:var(--primary-soft);color:var(--on-soft);border-radius:var(--r-ctl);font-size:.875rem;line-height:1.55}

/* 3D */
.v3d{position:relative;height:clamp(360px,64vw,540px);border-radius:var(--r-ctl);overflow:hidden;background:radial-gradient(ellipse at 50% 35%,var(--stage1),var(--stage2));touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.v3d.drag{cursor:grabbing}
.scene{position:absolute;inset:0;perspective:1500px;perspective-origin:50% 40%}
.book{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.floor{position:absolute;left:50%;top:calc(50% + var(--ph)/2 + 26px);width:calc(var(--pw)*2);height:calc(var(--pw)*.5);transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(0,0,0,.38),transparent 68%);filter:blur(6px);pointer-events:none}
.strip{position:absolute;top:0;height:100%;width:calc(var(--sw) + .6px);transform-style:preserve-3d;transform-origin:0 50%}
.strip.r{transform-origin:100% 50%}
.strip.root{top:calc(var(--ph)/-2);left:0;height:var(--ph)}
.strip.root.r{left:auto;right:0}
.strip .strip{left:calc(100% - .6px)}
.strip.r .strip.r{left:auto;right:calc(100% - .6px)}
.face{position:absolute;inset:0;background-color:#fff;background-repeat:no-repeat;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.v3d-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--text2);font-size:.9375rem;pointer-events:none}
.v3d-tip{position:absolute;left:12px;bottom:10px;font-size:.75rem;color:var(--text2);background:var(--surface);padding:3px 10px;border-radius:100px;opacity:.92;pointer-events:none}
.stepper{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stepper .btn{min-height:52px;font-size:1rem}
.faces{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;background:var(--primary-soft);color:var(--on-soft);font-weight:700;font-size:.9375rem;font-variant-numeric:tabular-nums}
.chip i{font-style:normal;font-weight:500;font-size:.8125rem;opacity:.85}

/* 設計図 */
.fig{background:#0B3A8C;border-radius:var(--r-ctl);overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-ctl)}
.tbl table{border-collapse:collapse;width:100%;min-width:420px;font-size:.875rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--line)}
.tbl th{background:var(--surface2);font-weight:700;font-size:.8125rem}
.tbl tr:last-child td{border-bottom:0}
details>summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}

/* 印刷ガイド */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.steps li{background:var(--surface2);border-radius:var(--r-ctl);padding:14px;display:flex;flex-direction:column;gap:6px;font-size:.9375rem;line-height:1.6}
.steps h3{font-size:1rem;display:flex;align-items:center;gap:8px}
.steps h3 i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:.8125rem}
.steps ul{margin:0;padding-left:1.2em}
.steps .key{background:var(--warn-bg);color:var(--warn);padding:2px 8px;border-radius:6px;font-weight:700}

/* 編集 */
.ed-main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:1180px){.ed-main{grid-template-columns:minmax(0,1fr) 270px;align-items:start}}
.ed-stage{background:var(--stage1);border-radius:var(--r-ctl);padding:10px;overflow:auto;display:flex;justify-content:center;min-height:200px}
.ed-page{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.3);line-height:0;flex:none}
.ed-page canvas{display:block}
.ed-ov{position:absolute;inset:0;user-select:none;-webkit-user-select:none}
.ed-ov>*{position:absolute}
.ed-ov.t-text,.ed-ov.t-erase,.ed-ov.t-clip,.ed-ov.t-region{cursor:crosshair;touch-action:none}
.clipbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--primary-soft);margin:8px 0}
.clipbar[hidden]{display:none}
.clipbar .cl-list{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 100%}
#clOv .ed-rb,.cl-box{position:absolute}
.cl-box{border:2px solid #1B3FE0;background:rgba(27,63,224,.1);border-radius:3px;pointer-events:none;box-sizing:border-box}
.cl-box b{position:absolute;left:0;top:0;background:#1B3FE0;color:#fff;font-size:11px;line-height:16px;padding:0 5px;border-radius:0 0 4px 0}
.cl-in{width:5.5em;min-height:36px;padding:0 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit}
.cl{position:relative;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px}
.cl img{display:block;height:46px;max-width:120px;object-fit:contain}
.cl button{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:0;background:#c0392b;color:#fff;font-size:.8rem;line-height:20px;padding:0;cursor:pointer}
.ed-ov.t-edit{cursor:pointer}
.ed-cover,.ed-img,.ed-text{pointer-events:none}
.t-select .ed-cover,.t-select .ed-img,.t-select .ed-text{pointer-events:auto;cursor:move}
.t-select .ed-cover{outline:1px dashed rgba(27,63,224,.45)}
.ed-img{max-width:none}
.ed-line{border:1px dashed rgba(27,63,224,.35);background:rgba(27,63,224,.05)}
.ed-line:hover{background:rgba(27,63,224,.22);border-color:#1B3FE0}
.t-select .ed-cover[data-auto]{outline:none;pointer-events:none}
.ed-line{pointer-events:none}
.ed-sel{border:1.5px dashed #1B3FE0;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.ed-hd{width:16px;height:16px;background:#1B3FE0;border:2px solid #fff;border-radius:4px;transform:translate(-50%,-50%);cursor:nwse-resize;touch-action:none}
.ed-rb{border:1.5px dashed #1B3FE0;background:rgba(27,63,224,.14);pointer-events:none}
.ed-props{background:var(--surface2);border-radius:var(--r-ctl);padding:12px;display:flex;flex-direction:column;gap:10px;font-size:.875rem;min-width:0}
.ed-props h3{font-size:.9375rem}
.ed-props textarea{width:100%;min-height:84px;padding:8px 10px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);resize:vertical;line-height:1.5}
.ed-props .f{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ed-props input[type=color]{width:48px;height:34px;padding:0;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}
.ed-props input[type=range]{flex:1;min-width:0;accent-color:var(--primary)}
.ed-props input[type=number]{width:64px;min-height:34px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);padding:0 6px}
.ed-pgbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ed-thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.th{flex:none;width:76px;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.th img,.th .bl{width:100%;aspect-ratio:1/1.41;object-fit:contain;background:#fff;border-radius:4px;display:block}
.th span{font-size:.75rem;color:var(--text2);font-variant-numeric:tabular-nums}
.th[aria-current="true"]{border-color:var(--primary);background:var(--primary-soft)}
.th .dot{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;background:#E5484D;border:2px solid #fff}

.t-select .ed-cover,.t-select .ed-text,.t-select .ed-img,.ed-hd{touch-action:none}
.ed-hd{pointer-events:auto}
#edTools{flex:none}
/* 下部ナビ とFAB */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-in{display:grid;grid-template-columns:repeat(7,1fr);max-width:640px;margin:0 auto;padding-block:6px}
.bn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.6875rem;color:var(--text2);cursor:pointer;padding:2px 0;min-height:52px;font-weight:500}
.bn .ic{width:46px;height:30px;border-radius:100px;display:grid;place-items:center}
.bn[aria-current="page"]{color:var(--text);font-weight:700}
.bn[aria-current="page"] .ic{background:var(--primary-soft);color:var(--on-soft)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:34;min-height:52px;border-radius:16px;padding:0 20px;box-shadow:0 4px 14px rgba(0,0,0,.28)}

.busy{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:24px}
.busy>div{background:var(--surface);border-radius:var(--r-card);padding:24px;max-width:320px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--primary);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:6px;border-radius:3px;background:var(--surface2);width:100%;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--primary);transition:width .15s}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:100px;font-size:.875rem;max-width:90vw;text-align:center}
@media (min-width:960px){.toast{bottom:32px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* Material 3 light workspace */
:root{color-scheme:light;--bg:#F7F8FA;--surface:#FFF;--surface2:#F0F2F5;--text:#202124;--text2:#5F6368;--line:#DADCE0;--line-strong:#747775;--primary:#0B57D0;--on-primary:#FFF;--primary-soft:#D3E3FD;--on-soft:#041E49;--stage1:#E8EAED;--stage2:#DADCE0;--r-card:12px;--r-ctl:8px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:light}}:root[data-theme="dark"]{color-scheme:light}
body{font-size:14px;line-height:1.5}.top-in,.wrap{max-width:1600px}.card{border:1px solid #E1E3E1;border-radius:12px;box-shadow:0 1px 2px #0001}.btn{border-width:1px;border-radius:100px;font-weight:500}.tabs{background:transparent;border-bottom:1px solid var(--line);border-radius:0}.tab[aria-selected="true"]{background:transparent;box-shadow:inset 0 -3px var(--primary)}
.cl{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px;display:flex;flex-direction:column;gap:2px;width:130px;flex:none}
.cl label{font-size:.75rem;display:flex;gap:4px;align-items:center;color:var(--text)}
.cl select{min-height:32px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-size:.8125rem}
.cl img{display:block;width:100%;max-height:60px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px;cursor:pointer}
.doc-list{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.doc-item{flex:none;width:150px;display:flex;align-items:center;gap:8px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;cursor:pointer}.doc-item.active{border:2px solid var(--primary);background:var(--primary-soft)}.doc-item canvas{width:42px;height:54px;object-fit:contain;background:#fff;border:1px solid var(--line)}.doc-item span{font-size:.75rem;line-height:1.35;overflow-wrap:anywhere}
.marquee{position:absolute;border:1px dashed var(--primary);background:rgba(11,87,208,.12);pointer-events:none}
</style>
</head>
<body>

<header class="top">
  <div class="top-in gut">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v13"/><path d="M12 6C10 4.6 7 4.2 4 4.6v13c3-.4 6 0 8 1.4 2-1.4 5-1.8 8-1.4v-13c-3-.4-6 0-8 1.4z"/></svg>
      </div>
      <div><h1>中綴じ冊子メーカー</h1><p>PDFを編集して、両面印刷→折るだけの冊子に</p></div>
    </div>
    <button type="button" class="btn desk-only" data-save="pdf">冊子用PDFを保存</button>
  </div>
</header>

<main class="wrap gut">
  <aside class="side" id="side">
    <section class="card" aria-labelledby="h-file">
      <h2 id="h-file">PDF・画像ファイル</h2>
      <label class="drop" id="drop" for="fileIn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
        <b>PDF・画像を選ぶ</b>
        <span>画像は印刷向けに自動補正してPDFにまとめます</span>
      </label>
      <input class="vh" type="file" id="fileIn" accept="application/pdf,.pdf,image/*" multiple>
      <div class="doc-list" id="docList" aria-label="読み込んだPDF"></div>
      <div class="fileinfo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>
        <div class="fi-t"><b id="fname">—</b><small id="fmeta"></small></div>

      </div>
      <p class="msg err" id="ferr" role="alert" hidden></p>
      <p class="hint">PDF・画像はこの端末の中だけで処理します。外部には送信されません。</p>
    </section>

    <section class="card" aria-labelledby="h-set">
      <h2 id="h-set">仕上がり</h2>
      <fieldset>
        <legend>とじ方（背の位置）</legend>
        <div class="bind">
          <label class="opt"><input type="radio" name="bind" value="ltr" checked>
            <span class="opt-body">
              <svg width="40" height="48" viewBox="0 0 40 48" fill="none" aria-hidden="true"><rect x="6" y="4" width="28" height="40" rx="2" stroke="currentColor" stroke-width="2"/><rect x="6" y="4" width="5" height="40" rx="1" fill="currentColor"/></svg>
              <b>左とじ</b><small>横書き・洋書・資料</small>
            </span></label>
          <label class="opt"><input type="radio" name="bind" value="rtl">
            <span class="opt-body">
              <svg width="40" height="48" viewBox="0 0 40 48" fill="none" aria-hidden="true"><rect x="6" y="4" width="28" height="40" rx="2" stroke="currentColor" stroke-width="2"/><rect x="29" y="4" width="5" height="40" rx="1" fill="currentColor"/></svg>
              <b>右とじ</b><small>縦書き・和書・漫画</small>
            </span></label>
        </div>
      </fieldset>
      <div>
        <label class="lbl" for="paper">印刷する用紙</label>
        <select class="sel" id="paper"></select>
      </div>
      <div>
        <label class="lbl" for="margin">ページの外側の余白</label>
        <div class="rng"><input type="range" id="margin" min="0" max="15" step="1" value="0"><output id="marginO" for="margin">0 mm</output></div>
        <p class="hint">プリンターで端が切れるときに増やします。</p>
      </div>
      <label class="sw"><input type="checkbox" id="fold" role="switch" checked><span class="trk"></span><span class="sw-t"><b>折り線ガイド</b><small>用紙の中央に薄い点線を入れる</small></span></label>
      <label class="sw"><input type="checkbox" id="lock" role="switch"><span class="trk"></span><span class="sw-t"><b>最終ページを裏表紙に固定</b><small>白紙は最後の手前に入れる</small></span></label>
    </section>

    <section class="card desk-only" aria-labelledby="h-out">
      <h2 id="h-out">出力</h2>
      <button type="button" class="btn" data-save="pdf">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
        冊子用PDFを保存
      </button>
      <button type="button" class="btn sub" id="printBtn" hidden>このまま印刷</button>

    </section>
  </aside>

  <section class="stage" aria-label="確認と編集">
    <div class="card">
      <dl class="stats" id="stats"></dl>
      <p class="msg warn" id="warn" role="status" hidden></p>
    </div>

    <div class="card">
      <div class="tabs" role="tablist" aria-label="画面の切り替え" id="tabs">
        <button class="tab" role="tab" id="t-imp" aria-controls="p-imp" aria-selected="true" data-v="imp">面付け</button>
        <button class="tab" role="tab" id="t-edit" aria-controls="p-edit" aria-selected="false" data-v="edit" tabindex="-1">編集</button>
        
        <button class="tab" role="tab" id="t-3d" aria-controls="p-3d" aria-selected="false" data-v="3d" tabindex="-1">3D完成</button>
        
        <button class="tab" role="tab" id="t-print" aria-controls="p-print" aria-selected="false" data-v="print" tabindex="-1">印刷と製本</button>
      </div>

      <!-- 面付け -->
      <div class="panel" id="p-imp" role="tabpanel" aria-labelledby="t-imp">
        <div class="ctl">
          <div class="seg" role="group" aria-label="用紙の面">
            <button type="button" id="sideF" aria-pressed="true">表面</button>
            <button type="button" id="sideB" aria-pressed="false">裏面</button>
          </div>
          <div class="nav">
            <button type="button" class="btn sub" id="prevS" aria-label="前の面">‹</button>
            <input type="range" id="sheetR" min="1" max="6" value="1" aria-label="面の番号（表1→裏1→表2→裏2…）">
            <button type="button" class="btn sub" id="nextS" aria-label="次の面">›</button>
            <span class="pos" id="sheetPos">1 / 3</span>
          </div>
        </div>
        <div class="sheetbox">
          <canvas id="sheetCv" width="800" height="283" aria-label="用紙の面付けプレビュー"></canvas>
          <div class="slots"><div>左 <b id="sl-l">P.—</b></div><div>右 <b id="sl-r">P.—</b></div></div>
        </div>
        <p class="order" id="orderHint"></p>
      </div>

      <!-- 編集 -->
      <div class="panel" id="p-edit" role="tabpanel" aria-labelledby="t-edit" hidden>
        <div class="ctl">
          <div class="seg" id="edTools" role="group" aria-label="編集ツール">
            <button type="button" data-tool="select" aria-pressed="true">選択・移動</button>
            <button type="button" data-tool="text" aria-pressed="false">文字を追加</button>
            <button type="button" data-tool="erase" aria-pressed="false">白で消す</button>
          </div>
          <button type="button" class="btn sub sm" id="edUndo">元に戻す</button>
          <button type="button" class="btn sub sm" id="edRedo">やり直す</button>
          <button type="button" class="btn sub sm" id="boxSelectBtn" aria-pressed="false">囲んで切り抜く</button><button type="button" class="btn sub sm" id="copySelBtn">コピー</button><button type="button" class="btn sub sm" id="cutSelBtn">切り取り</button><button type="button" class="btn sub sm" id="pasteSelBtn">貼り付け</button><button type="button" class="btn danger sm" id="delSelBtn">Delete</button>
        </div>
        <div class="ctl" id="edSplitRow" hidden><button type="button" class="btn tonal sm" id="splitPage">このページの文字をまとめて編集可能にする</button><button type="button" class="btn tonal sm" id="splitAll">全ページをまとめて編集可能にする</button></div>
        <p class="msg info" id="edHint"></p>
        <div class="ed-main">
          <div class="ed-stage" id="edStage"><div class="ed-page" id="edPage"><canvas id="edCv"></canvas><div class="ed-ov" id="edOv"></div></div></div>
          <div class="ed-props" id="edProps"></div>
          
        </div>
        <div class="ed-pgbar">
          <button type="button" class="btn sub sm" id="pgPrev" aria-label="前のページ">‹</button>
          <span class="pos" id="edPos">1 / 1</span>
          <button type="button" class="btn sub sm" id="pgNext" aria-label="次のページ">›</button>
          <button type="button" class="btn tonal sm" id="pgBlank">白紙を挿入</button>
          <button type="button" class="btn tonal sm" id="pgDup">複製</button>
          <button type="button" class="btn tonal sm" id="pgRot">回転</button>
          <button type="button" class="btn tonal sm" id="pgL">← 前へ移動</button>
          <button type="button" class="btn tonal sm" id="pgR">後ろへ移動 →</button>
          <button type="button" class="btn danger sm" id="pgDel">ページを削除</button>
        </div>
        <div class="ed-thumbs" id="edThumbs" aria-label="ページ一覧"></div>
        <div class="ctl">
          <button type="button" class="btn" id="edApply">変更を反映</button>
          <button type="button" class="btn sub" id="edReset">すべて元に戻す</button>
          <span class="hint" id="edState"></span>
        </div>
      </div>

      <!-- 3D -->
      <div class="panel" id="p-3d" role="tabpanel" aria-labelledby="t-3d" hidden>
        <div class="v3d" id="v3d" tabindex="0" aria-label="3D冊子。左右の矢印キーで1枚ずつめくれます" style="--pw:200px;--ph:283px;--sw:calc(var(--pw)/6)">
          <div class="scene"><div class="book" id="book"></div><div class="floor"></div></div>
          <div class="v3d-msg" id="v3dMsg">3Dを準備しています…</div>
          <div class="v3d-tip">ドラッグで回転・ホイールで拡大</div>
        </div>
        <div class="stepper">
          <button type="button" class="btn sub" id="prevPg">‹ 前のページへ</button>
          <button type="button" class="btn" id="nextPg">次のページへ ›</button>
        </div>
        <div class="faces" id="faces" aria-live="polite"></div>
        <div class="ctl">
          <div class="nav">
            <button type="button" class="btn sub" id="playBtn" aria-label="自動で順にめくる">▶</button>
            <input type="range" id="turnR" min="0" max="3" step="0.01" value="0" aria-label="ページをめくる">
          </div>
        </div>
        <div class="ctl">
          <div class="seg" role="group" aria-label="開く位置">
            <button type="button" data-jump="0" aria-pressed="false">表紙</button>
            <button type="button" data-jump="mid" aria-pressed="false">中央</button>
            <button type="button" data-jump="end" aria-pressed="false">裏表紙</button>
          </div>
          <div class="seg" role="group" aria-label="見る角度">
            <button type="button" data-cam="iso" aria-pressed="true">斜め</button>
            <button type="button" data-cam="front" aria-pressed="false">正面</button>
            <button type="button" data-cam="top" aria-pressed="false">真上</button>
          </div>
        </div>
        <p class="hint">1回押すごとに用紙を1枚めくります。表（奇数ページ）→ めくると裏（偶数ページ）→ 次の用紙の表、の順に進みます。</p>
      </div>

      <!-- 印刷 -->
      <div class="panel" id="p-print" role="tabpanel" aria-labelledby="t-print" hidden>
        <ol class="steps" id="steps"></ol>
        <p class="msg info" id="printNote"></p>
      </div>
    </div>
  </section>
</main>

<button type="button" class="btn fab" data-save="pdf">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
  PDFを保存
</button>
<nav class="bnav" aria-label="画面の切り替え"><div class="bnav-in gut" id="bnav">
  <button class="bn" data-v="set" type="button"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>設定</button>
  <button class="bn" data-v="imp" type="button"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="8" height="14" rx="1.5"/><rect x="13" y="5" width="8" height="14" rx="1.5"/></svg></span>面付け</button>
  <button class="bn" data-v="edit" type="button"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></span>編集</button>
  <button class="bn" data-v="3d" type="button"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></span>3D</button>
  <button class="bn" data-v="print" type="button"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/></svg></span>印刷</button>
</div></nav>

<div class="busy" id="busy" hidden role="alertdialog" aria-live="assertive" aria-label="処理中"><div><div class="spin"></div><b id="busyT">処理中…</b><div class="bar"><i id="busyB"></i></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (Math.round(n * 10) / 10).toString();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nextFrame = () => new Promise(r => setTimeout(r, 0));
const store = {
  get(k, d) { try { const v = localStorage.getItem('mt.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mt.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- 定数 ---------- */
const PAPERS = {
  a4:     { label: 'A4 横（A5の冊子になる）',   w: 297,   h: 210,   fin: 'A5',  name: 'A4' },
  a3:     { label: 'A3 横（A4の冊子になる）',   w: 420,   h: 297,   fin: 'A4',  name: 'A3' },
  b4:     { label: 'B4 横（B5の冊子になる）',   w: 364,   h: 257,   fin: 'B5',  name: 'B4' },
  letter: { label: 'レター 横（半分サイズの冊子）', w: 279.4, h: 215.9, fin: '5.5×8.5in', name: 'レター' }
};
const SIZES = [['A3',297,420],['A4',210,297],['A5',148,210],['A6',105,148],['B4',257,364],['B5',182,257],['B6',128,182],['レター',215.9,279.4]];
const LEAF_MM = 0.1, STR = 6, MMPT = 72 / 25.4;
const CDN_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const SANS = '"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif';
const SERIF = '"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif';

/* ---------- 状態 ---------- */
const DOCS = []; let ACTIVE_DOC = null;
const S = {
  binding: store.get('binding', 'ltr'), paper: store.get('paper', 'a4'), margin: store.get('margin', 0),
  fold: store.get('fold', true), lock: store.get('lock', false),
  econ: Object.assign({ crop: false, mode: 'common', pad: 3, blank: false }, store.get('econ', {})),
  view: 'imp', sheet: 1, side: 'front',
  js: null, bytes: null, n: 0, name: '', sample: false, srcId: 0, pw: 148, ph: 210, size: '', fileSize: 0,
  orig: null, an: null, crops: []
};
if (!PAPERS[S.paper]) S.paper = 'a4';
if (S.binding !== 'ltr' && S.binding !== 'rtl') S.binding = 'ltr';
S.margin = clamp(+S.margin || 0, 0, 15); S.econ.pad = clamp(+S.econ.pad || 0, 0, 12);
S.econ.crop = false; S.econ.blank = false;
const slotCache = new Map(), texCache = new Map();

/* ---------- 節約: 余白・白紙の分析 ---------- */
async function ensureAnalysis() {
  if (S.an && S.an.id === S.srcId) return;
  const id = S.srcId, pages = [null];
  try {
    for (let p = 1; p <= S.n; p++) {
      busy(true, '空白を調べています…', p / S.n);
      const pg = await S.js.getPage(p), vp1 = pg.getViewport({ scale: 1 });

      const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.ceil(vp1.width * sc)); cv.height = Math.max(1, Math.ceil(vp1.height * sc));

  const bx = bx0 + (bw - dw) / 2, by = by0 + (bh - dh) / 2;
  let x = bx, y = by;
  if (rot === 90) y = by + sw; else if (rot === 180) { x = bx + sw; y = by + sh; } else if (rot === 270) x = bx + sh;
  page.drawPage(emb, { x, y, xScale: s, yScale: s, rotate: degrees(-rot) });
}
async function buildPdf(onProg) {
  const { PDFDocument, rgb } = PDFLib, L = calcLayout(), P = PAPERS[S.paper];
  const mm = 72 / 25.4, SW = P.w * mm, SH = P.h * mm, slotW = SW / 2, m = S.margin * mm;
  const src = await PDFDocument.load(S.bytes, { ignoreEncryption: true }), out = await PDFDocument.create(), pages = src.getPages();
  const boxes = pages.map((p, i) => {
    const cb = S.crops[i + 1];
    if (cb && S.an && S.an.pages[i + 1]) { const vp = S.an.pages[i + 1].vp, a = vp.convertToPdfPoint(cb.x0, cb.y0), b = vp.convertToPdfPoint(cb.x1, cb.y1); return { left: Math.min(a[0], b[0]), bottom: Math.min(a[1], b[1]), right: Math.max(a[0], b[0]), top: Math.max(a[1], b[1]) }; }
    const c = p.getCropBox(); return { left: c.x, bottom: c.y, right: c.x + c.width, top: c.y + c.height };
  });
  const emb = await out.embedPages(pages, boxes), rots = pages.map(p => ((p.getRotation().angle % 360) + 360) % 360);
  const side = (a, b) => {
    const pg = out.addPage([SW, SH]);
    [a, b].forEach((k, i) => { const sp = L.map[k]; if (sp > 0) drawFit(pg, emb[sp - 1], rots[sp - 1], i * slotW + m, m, slotW - 2 * m, SH - 2 * m); });
    if (S.fold) pg.drawLine({ start: { x: slotW, y: 14 }, end: { x: slotW, y: SH - 14 }, thickness: .5, color: rgb(.72, .72, .75), dashArray: [4, 4] });
  };
  for (let i = 1; i <= L.K; i++) { const s = sheetSlots(i, L); side(...s.front); side(...s.back); onProg && onProg(i / L.K); if (i % 4 === 0) await nextFrame(); }
  return out.save();
}
async function saveFile(name, data) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) {
      try { await dl.save({ filename: name, data }); toast('保存しました'); }
      catch (e) { if (!e || e.code !== 'declined') toast('保存できませんでした'); }
      return;
    }
  } catch (e) {}
  const url = URL.createObjectURL(new Blob([data])), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast('ダウンロードを開始しました');
}
async function doSavePdf() {
  if (!S.js) return;
  await commitEdits(); await refreshing;
  busy(true, '冊子用PDFを作成中…', 0.05);
  try { const bytes = await buildPdf(p => busy(true, null, p)); busy(false); await saveFile('冊子.pdf', bytes); }
  catch (e) { busy(false); toast('PDFを作成できませんでした。'); }
}

/* ---------- イベント ---------- */
function bind() {
  $('#paper').innerHTML = Object.entries(PAPERS).map(([k, p]) => `<option value="${k}">${p.label}</option>`).join('');
$('#fileIn').addEventListener('change', async e => { await handleFiles(e.target.files); e.target.value = ''; });
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
  $$('input[name=bind]').forEach(r => r.addEventListener('change', () => { S.binding = r.value; onSetting(); }));
  $('#paper').addEventListener('change', e => { S.paper = e.target.value; onSetting(); });
  $('#margin').addEventListener('input', e => { S.margin = +e.target.value; $('#marginO').textContent = S.margin + ' mm'; });
  $('#margin').addEventListener('change', onSetting);
  $('#fold').addEventListener('change', e => { S.fold = e.target.checked; onSetting(); });
  $('#lock').addEventListener('change', e => { S.lock = e.target.checked; onSetting(); });
  $$('[data-save]').forEach(b => b.addEventListener('click', doSavePdf));

  $$('.tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.v)));
  $$('.bn').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));
  $('#sideF').addEventListener('click', () => { S.side = 'front'; updateSheetUI(); paintSheet(); });
  $('#sideB').addEventListener('click', () => { S.side = 'back'; updateSheetUI(); paintSheet(); });
  // 面付けの送り順: 用紙1の表 → 用紙1の裏 → 用紙2の表 → 用紙2の裏 → …
  const goStep = n => {
    const total = calcLayout().K * 2, s = clamp(n, 1, total) - 1;
    S.sheet = Math.floor(s / 2) + 1; S.side = s % 2 ? 'back' : 'front';
    updateSheetUI(); paintSheet();
  };
  const curStep = () => (S.sheet - 1) * 2 + (S.side === 'back' ? 2 : 1);
  $('#prevS').addEventListener('click', () => goStep(curStep() - 1));
  $('#nextS').addEventListener('click', () => goStep(curStep() + 1));
  $('#sheetR').addEventListener('input', e => goStep(+e.target.value));
  bindEditorOverlay(); renderProps();
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { E.tc.clear(); if (S.view === 'edit') renderOverlay(); });
  document.addEventListener('keydown', e => {
    const tg = e.target; if (tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
    if (S.view === 'imp') { if (e.key === 'ArrowLeft') goStep(curStep() - 1); else if (e.key === 'ArrowRight') goStep(curStep() + 1); return; }
    if (S.view !== 'edit') return;
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase(), op = curOp();
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && k === 'y') { e.preventDefault(); redo(); }
    else if (mod && k === 'c') { e.preventDefault(); copySelection(); }
    else if (mod && k === 'x') { e.preventDefault(); cutSelection(); }
    else if (mod && k === 'v') { e.preventDefault(); pasteSelection(); }
    else if (e.key === 'Delete') { e.preventDefault(); if (op) delOp(); else pgDel(); }
    else if (e.key === 'Backspace' && op) { e.preventDefault(); delOp(); }
    else if (e.key === 'Escape') { E.tool !== 'select' ? setTool('select') : selOp(null); }
    else if (e.key.startsWith('Arrow')) {
      e.preventDefault(); const d = e.shiftKey ? 10 : 1;
      if (op && e.key === 'ArrowLeft') { pushHist(); op.x -= d; } else if (op && e.key === 'ArrowRight') { pushHist(); op.x += d; }
      else if (op && e.key === 'ArrowUp') { pushHist(); op.y -= d; } else if (op && e.key === 'ArrowDown') { pushHist(); op.y += d; }
      else if (e.key === 'ArrowLeft') { E.cur = Math.max(0, E.cur - 1); edRender(true); } else if (e.key === 'ArrowRight') { E.cur = Math.min(E.pages.length - 1, E.cur + 1); edRender(true); }
      if (op) { markDirty(); renderOverlay(); }
    }
  });

  // 3D
  const v = $('#v3d'); let drag = null;
  v.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; v.classList.add('drag'); v.setPointerCapture(e.pointerId); });
  v.addEventListener('pointermove', e => { if (!drag) return; V.ry += (e.clientX - drag.x) * .45; V.rx = clamp(V.rx - (e.clientY - drag.y) * .35, -85, 20); drag = { x: e.clientX, y: e.clientY }; render3D(); });
  const end = () => { drag = null; v.classList.remove('drag'); };
  v.addEventListener('pointerup', end); v.addEventListener('pointercancel', end);
  $('#nextPg').addEventListener('click', () => stepLeaf(1));
  $('#prevPg').addEventListener('click', () => stepLeaf(-1));
  $('#turnR').addEventListener('input', e => { stopPlay(); cancelAnimationFrame(V.raf); V.p = +e.target.value; render3D(); });
  $('#playBtn').addEventListener('click', autoPlay);

  // 編集
  $('#pgPrev').addEventListener('click', () => { E.cur = Math.max(0, E.cur - 1); edRender(true); });
  $('#pgNext').addEventListener('click', () => { E.cur = Math.min(E.pages.length - 1, E.cur + 1); edRender(true); });
  $('#pgBlank').addEventListener('click', pgInsertBlank); $('#pgDup').addEventListener('click', pgDup); $('#pgRot').addEventListener('click', pgRot);
  $('#pgL').addEventListener('click', () => pgMove(-1)); $('#pgR').addEventListener('click', () => pgMove(1)); $('#pgDel').addEventListener('click', pgDel);
  $('#splitPage').addEventListener('click', () => splitPages(false)); $('#splitAll').addEventListener('click', () => splitPages(true));
  $('#edApply').addEventListener('click', () => commitEdits());
$('#boxSelectBtn').addEventListener('click',e=>{E.boxSelect=!E.boxSelect;e.currentTarget.setAttribute('aria-pressed',String(E.boxSelect));});
  $('#copySelBtn').addEventListener('click',copySelection); $('#cutSelBtn').addEventListener('click',cutSelection); $('#pasteSelBtn').addEventListener('click',pasteSelection); $('#delSelBtn').addEventListener('click',delOp);
  $('#edUndo').addEventListener('click', undo); $('#edRedo').addEventListener('click', redo);
  $('#edReset').addEventListener('click', async () => { if (!S.orig) return; pgOp(() => { E.pages = []; for (let i = 1; i <= S.orig.js.numPages; i++) E.pages.push({ src: i, rot: 0, ops: [] }); E.cur = 0; }); await commitEdits(); });
  $$('[data-jump]').forEach(b => b.addEventListener('click', () => { if (!V.ready) return; stopPlay(); const nl = V.L.M / 2, j = b.dataset.jump; animateTo(j === '0' ? 0 : j === 'end' ? nl : Math.round(nl / 2), 900); }));
  const CAMS = { iso: [-24, -26], front: [0, 0], top: [-85, 0] };
  $$('[data-cam]').forEach(b => b.addEventListener('click', () => { [V.rx, V.ry] = CAMS[b.dataset.cam]; $$('[data-cam]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render3D(); }));
}

/* ---------- 起動 ---------- */
(async function init() {
  bind(); await setView('imp');
  try {
    busy(true, 'ライブラリを確認中…', 0.1);
    await waitLibs();
    ensureWorker();
    // PDFを選ぶまで空の状態で待機
  } catch (e) {
    console.error(e);
    const err = $('#ferr');
    if (err) { err.textContent = e.message || e; err.hidden = false; }
  } finally {
    busy(false);
  }
})();
})();
</script>
